# SnapDeploy configuration template
# Replace values with your SnapDeploy project settings before deploying.
service:
  name: nia-jaya-fotocopy
  runtime: docker
  build:
    dockerfile: Dockerfile
    context: .
  env:
    FLASK_SECRET_KEY: ${FLASK_SECRET_KEY}
    SUPABASE_URL: ${SUPABASE_URL}
    SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
    SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE}
  ports:
    - container: 8000
      protocol: http

# Hooks (optional): you can add pre/post deploy scripts here
hooks:
  predeploy:
    - echo "Pre-deploy: verifying environment"
  postdeploy:
    - echo "Post-deploy: healthcheck"
