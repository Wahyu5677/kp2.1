{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-4">
            <h3 class="h5 mb-3 fw-bold">Catat Arus Kas Masuk / Keluar</h3>
            <form method="POST">
                <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
                <div class="mb-3">
                    <label class="form-label">Tanggal</label>
                    <input type="date" name="tanggal" class="form-control" required value="{{ form_data.tanggal|default('') }}">
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Pemasukan (Rp)</label>
                        <input type="number" name="pemasukan" class="form-control" min="0" step="1" inputmode="numeric" required placeholder="0" value="{{ form_data.pemasukan|default('0') }}">
                        <small class="text-muted">Isi 0 jika tidak ada pemasukan untuk transaksi ini.</small>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Pengeluaran (Rp)</label>
                        <input type="number" name="pengeluaran" class="form-control" min="0" step="1" inputmode="numeric" required placeholder="0" value="{{ form_data.pengeluaran|default('0') }}">
                        <small class="text-muted">Isi 0 jika tidak ada pengeluaran untuk transaksi ini.</small>
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label">Keterangan Catatan</label>
                    <textarea name="keterangan" class="form-control" rows="3" placeholder="Contoh: Pembelian tinta toner printer atau pendapatan fotocopy KTP harian" required>{{ form_data.keterangan|default('') }}</textarea>
                    <small class="text-muted">Jelaskan sumber transaksi untuk memudahkan pelacakan di laporan.</small>
                </div>
                <div class="d-flex justify-content-end gap-2">
                    <a href="/keuangan" class="btn btn-light btn-sm">Batal</a>
                    <button type="submit" class="btn btn-primary btn-sm">Simpan Buku Kas</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
