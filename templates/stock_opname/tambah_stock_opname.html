{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-4">
            <h3 class="h5 mb-3 fw-bold">Form Audit Stock Opname</h3>
            <form method="POST">
                <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
                <div class="mb-3">
                    <label class="form-label">Pilih Barang</label>
                    <select name="id_barang" class="form-select" required>
                        <option value="">-- Pilih Produk Fotocopy/ATK --</option>
                        {% for b in barang %}
                        <option value="{{ b.id_barang }}" {% if form_data.id_barang|string == b.id_barang|string %}selected{% endif %}>{{ b.nama_barang }}</option>
                        {% endfor %}
                    </select>
                    <small class="text-muted">Pilih item yang sedang dihitung stok fisiknya.</small>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Stok di Sistem</label>
                        <input type="number" name="stok_sistem" class="form-control" min="0" step="1" inputmode="numeric" required placeholder="Angka komputer" value="{{ form_data.stok_sistem|default('') }}">
                        <small class="text-muted">Angka yang tercatat di sistem saat ini.</small>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Stok Hitungan Fisik</label>
                        <input type="number" name="stok_fisik" class="form-control" min="0" step="1" inputmode="numeric" required placeholder="Hitung riil di rak" value="{{ form_data.stok_fisik|default('') }}">
                        <small class="text-muted">Hitung ulang stok secara manual di rak atau gudang.</small>
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label">Tanggal Pemeriksaan</label>
                    <input type="date" name="tanggal_opname" class="form-control" required value="{{ form_data.tanggal_opname|default('') }}">
                </div>
                <div class="d-flex justify-content-end gap-2">
                    <a href="/stock-opname" class="btn btn-light btn-sm">Batal</a>
                    <button type="submit" class="btn btn-primary btn-sm">Simpan Hasil</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
