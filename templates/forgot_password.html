{% extends 'base.html' %}
{% block title %}Lupa Password - Nia Jaya{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="col-md-5 col-lg-4">
        <div class="login-box">
            <div class="text-center mb-4">
                <h2 class="login-title text-primary"><i class="bi bi-question-circle"></i> Lupa Password</h2>
                <p class="login-subtitle">Reset password Anda</p>
            </div>
            
            <div class="alert alert-info mb-3">
                <small><i class="bi bi-info-circle"></i> Masukkan username Anda untuk menerima instruksi reset password.</small>
            </div>
            
            <form action="/forgot-password" method="POST">
                <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" name="username" class="form-control" required placeholder="Masukkan username" autocomplete="username">
                </div>
                <button type="submit" class="btn btn-primary w-100 mb-3">Kirim Instruksi Reset</button>
                <a href="/login" class="btn btn-light w-100">
                    <i class="bi bi-arrow-left"></i> Kembali ke Login
                </a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
